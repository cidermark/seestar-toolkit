name: Distribution validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate Python ${{ matrix.python }} / macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONPATH: ''
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify release-relevant runner
        run: python -c "import platform; assert platform.system() == 'Darwin'; assert platform.machine() == 'arm64'; print(platform.platform())"
      - name: Install declared test and build dependencies
        run: python -m pip install '.[dev,build]'
      - name: Public fixture and history checks
        run: python tools/check_public_inputs.py
      - name: Full test suite
        run: python -m pytest
      - name: Ruff
        run: python -m ruff check .
      - name: Applicable formatting
        run: python tools/check_formatting.py
      - name: Incremental whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check c294ffd HEAD
          fi
      - name: Build and inspect distributions; smoke-test isolated installations
        run: python tools/validate_distribution.py
      - name: Ensure validation did not modify tracked files
        run: git diff --exit-code
