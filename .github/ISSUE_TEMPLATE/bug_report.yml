name: Bug Report
description: Report reproducible behaviour that may be a defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Before posting diagnostics or metadata, review them for observing coordinates, timestamps, device identifiers and other private information. Do not attach FIT/FITS files by default. If a capture may be needed, describe it first so a suitable transfer and privacy review can be agreed.
  - type: input
    id: toolkit_version
    attributes:
      label: Seestar Toolkit version
      description: Run `seestar-toolkit --version`.
      placeholder: seestar-toolkit 1.1.0
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Run `python --version` in the Toolkit environment.
      placeholder: Python 3.13.x
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Mac and macOS
      description: Provide the Mac architecture and macOS version when known.
      placeholder: Apple silicon, macOS version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Provide the exact command, replacing private paths or labels with neutral placeholders.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitised error or diagnostic text
      description: Remove private paths, coordinates, device identifiers and capture metadata before posting.
      render: text
  - type: textarea
    id: capture_context
    attributes:
      label: Capture context, if relevant
      description: Describe the Seestar model, firmware and capture type or configuration. Do not attach capture files at this stage.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the information above and removed private paths, coordinates, identifiers and metadata.
          required: true
